name: Quality gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Theme architecture and compatibility
        run: npm run test:theme-layers

      - name: Negative compatibility checks
        run: npm run test:negative

      - name: Build debug artifacts
        run: npm run build:debug

      - name: Browser and accessibility checks
        run: node scripts/test-theme-browser.mjs
        env:
          KROMA_BROWSERS: chromium,firefox,webkit

      - name: Architecture metrics
        run: node scripts/report-architecture-metrics.mjs

      - name: Build minified artifacts
        run: npm run build:min

      - name: Whitespace
        run: git diff --check -- .
